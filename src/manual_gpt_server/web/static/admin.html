<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>manual-gpt-server — admin</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font: 14px/1.5 system-ui, sans-serif;
            margin: 0;
            padding: 16px;
            background: #111;
            color: #eee;
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            font-size: 18px;
            margin: 0 0 8px;
        }

        #status {
            font-size: 12px;
            color: #888;
            margin-bottom: 16px;
        }

        #status.ok {
            color: #7ec87e;
        }

        #status.err {
            color: #e57373;
        }

        #log {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 16px;
        }

        .request {
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            background: #1a1a1a;
        }

        .request h3 {
            margin: 0 0 8px;
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
        }

        .msg {
            margin: 4px 0;
        }

        .msg b {
            color: #7ec87e;
        }

        textarea {
            width: 100%;
            min-height: 120px;
            padding: 8px;
            background: #1a1a1a;
            color: #eee;
            border: 1px solid #333;
            border-radius: 6px;
            font: inherit;
            resize: vertical;
        }

        textarea:disabled {
            opacity: 0.5;
        }

        button {
            margin-top: 8px;
            margin-right: 8px;
            padding: 8px 14px;
            background: #2a6;
            color: #fff;
            border: none;
            border-radius: 6px;
            font: inherit;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <h1>manual-gpt-server — admin</h1>
    <div id="status">подключение...</div>

    <div id="log"></div>

    <textarea id="reply" placeholder="Печатай ответ ассистента, потом жми Send..." disabled></textarea>
    <div>
        <button id="send" disabled>Send (целиком)</button>
        <button id="send-stream" disabled>Send (стриминг)</button>
    </div>

    <script src="/static/admin.js"></script>
</body>

</html>
