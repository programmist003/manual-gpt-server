[project]
authors = [
  {name = "programmist", email = "programmist.030@gmail.com"},
]
dependencies = [
  "fastapi>=0.110",
  "starlette>=0.36",
  "uvicorn>=0.27",
  "websockets>=12",
]
description = "Add your description here"
name = "manual-gpt-server"
readme = "README.md"
requires-python = ">=3.9"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
manual-gpt-server = "manual_gpt_server:main"
manual-gpt-server-serve = "manual_gpt_server.server:main"

[project.optional-dependencies]
client = [
  "httpx>=0.27",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.17,<0.13.0"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.5.2",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
