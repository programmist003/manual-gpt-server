[project]
authors = [
  {name = "programmist", email = "programmist.030@gmail.com"},
]
dependencies = [
  "fastapi>=0.110",
  "starlette>=0.36",
  "uvicorn>=0.27",
  "websockets>=12",
]
description = "Add your description here"
name = "manual-gpt-server"
readme = "README.md"
requires-python = ">=3.9"
version = "0.1.0"

[project.scripts]
manual-gpt-server = "manual_gpt_server:main"
manual-gpt-server-web = "manual_gpt_server.web.app:main"

[project.optional-dependencies]
client = [
  "httpx>=0.27",
]
web = [
  "jinja2>=3.1",
]

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.12.17,<0.13.0"]
