[project]
name = "manual-gpt-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "programmist", email = "programmist.030@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "starlette>=0.36",
    "uvicorn>=0.27",
]

[project.scripts]
manual-gpt-server = "manual_gpt_server:main"
manual-gpt-server-web = "manual_gpt_server.web.app:make_app"

[project.optional-dependencies]
web = [
    "jinja2>=3.1",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
